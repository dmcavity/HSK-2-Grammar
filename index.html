<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>普通话 · HSK 2 Grammar Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F3;--card:#FFFFFF;--red:#C0392B;--red-dark:#922B21;--red-light:#FDEDEC;
  --gold:#CA8A04;--gold-light:#FEFCE8;--ink:#1C1117;--ink-soft:#6B5B62;--ink-faint:#B0A0A6;
  --green:#166534;--green-bg:#DCFCE7;--wrong:#7F1D1D;--wrong-bg:#FEF2F2;
  --r:14px;--sh:0 2px 16px rgba(28,17,23,.08);--shb:0 6px 32px rgba(28,17,23,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;}
.zh{font-family:'Noto Sans SC',sans-serif;cursor:pointer;border-radius:4px;transition:background .15s;padding:1px 3px;}
.zh:hover{background:rgba(192,57,43,.12);}
#app{min-height:100vh;}
/* HOME */
.home{max-width:680px;margin:0 auto;padding:24px 16px 40px;}
.home-header{text-align:center;padding:40px 0 32px;}
.home-title{font-family:'Noto Serif SC',sans-serif;font-size:2.4rem;font-weight:700;color:var(--red);letter-spacing:.02em;margin-bottom:6px;}
.home-sub{font-size:1rem;color:var(--ink-soft);}
.progress-banner{background:var(--card);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh);margin-bottom:28px;display:flex;align-items:center;gap:20px;}
.progress-ring{width:64px;height:64px;flex-shrink:0;}
.progress-info{flex:1;}
.progress-label{font-size:.8rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.lessons-grid{display:flex;flex-direction:column;gap:12px;}
.lesson-card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:16px;transition:transform .15s,box-shadow .15s;border:2px solid transparent;}
.lesson-card:hover:not(.locked){transform:translateY(-2px);box-shadow:var(--shb);border-color:var(--red-light);}
.lesson-card.locked{opacity:.5;cursor:not-allowed;}
.lesson-card.completed{border-color:#BBF7D0;}
.lesson-card.in-progress{border-color:#FDE68A;}
.lesson-num{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;flex-shrink:0;font-family:'Noto Serif SC',sans-serif;}
.lesson-card.completed .lesson-num{background:var(--green);}
.lesson-card.locked .lesson-num{background:#C8B8BC;}
.lesson-card.in-progress .lesson-num{background:var(--gold);}
.lesson-info{flex:1;}
.lesson-title{font-weight:600;font-size:.95rem;margin-bottom:2px;}
.lesson-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tag{background:var(--red-light);color:var(--red-dark);font-size:.75rem;padding:2px 8px;border-radius:99px;font-family:'Noto Sans SC',sans-serif;font-weight:500;}
.high-score{color:var(--green);font-weight:700;font-size:1rem;}
/* INTRO SCREEN */
.lesson-intro{max-width:620px;margin:0 auto;padding:24px 16px;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:.9rem;padding:4px 0;margin-bottom:20px;display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;}
.intro-header{background:var(--red);color:#fff;border-radius:var(--r);padding:28px 28px 24px;margin-bottom:20px;}
.intro-lesson-num{font-size:.8rem;opacity:.8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.intro-title{font-size:1.6rem;font-weight:700;margin-bottom:8px;font-family:'Noto Serif SC',sans-serif;}
.intro-desc{font-size:.9rem;opacity:.85;line-height:1.5;}
.grammar-preview{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.gp-card{background:var(--card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);}
.gp-card-top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.gp-zh{font-family:'Noto Serif SC',sans-serif;font-size:1.5rem;color:var(--red);font-weight:700;cursor:pointer;}
.gp-py{font-size:.85rem;color:var(--ink-soft);}
.gp-meaning{font-size:.85rem;color:var(--ink-soft);}
.gp-pattern{background:var(--gold-light);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0;font-size:.83rem;color:#713F12;margin-top:6px;}
.start-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:1rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s,transform .1s;}
.start-btn:hover{background:var(--red-dark);transform:translateY(-1px);}
.resume-btn{width:100%;background:#FEF9EE;color:var(--gold);border:2px solid #FDE68A;border-radius:var(--r);padding:14px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:10px;}
.resume-btn:hover{background:#FDE68A;}
/* LESSON VIEW */
.lesson-view{min-height:100vh;display:flex;flex-direction:column;}
.lesson-topbar{background:var(--card);border-bottom:1px solid #F0E8E8;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.quit-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:1.1rem;padding:4px;font-weight:700;}
.lesson-progress-wrap{flex:1;background:#F0E8E8;border-radius:99px;height:9px;overflow:hidden;}
.lesson-progress{background:var(--red);height:100%;border-radius:99px;transition:width .4s ease;}
.score-display{font-weight:700;color:var(--red);font-size:.9rem;min-width:36px;text-align:right;}
.nav-btns{display:flex;gap:4px;flex-shrink:0;}
.nav-btn{background:none;border:1.5px solid #E8DEDE;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:.95rem;padding:4px 10px;transition:all .15s;font-family:'DM Sans',sans-serif;}
.nav-btn:hover:not(:disabled){border-color:var(--red);color:var(--red);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.prompt-area{flex:1;max-width:640px;margin:0 auto;width:100%;padding:20px 16px 32px;}
.prompt-card{background:var(--card);border-radius:20px;padding:26px 26px 22px;box-shadow:var(--shb);}
.prompt-type-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
/* INTRO CARD (inside lesson) */
.intro-card-inner{text-align:center;}
.intro-point-zh{font-family:'Noto Serif SC',sans-serif;font-size:3rem;color:var(--red);font-weight:700;cursor:pointer;border-radius:8px;padding:4px 12px;display:inline-block;transition:background .15s;}
.intro-point-zh:hover{background:var(--red-light);}
.intro-point-py{font-size:1rem;color:var(--ink-soft);margin:4px 0 2px;}
.intro-point-meaning{font-size:1.1rem;font-weight:600;color:var(--ink);margin-bottom:16px;}
.intro-pattern-box{background:var(--gold-light);border:1.5px solid #FDE68A;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.9rem;color:#713F12;}
.intro-pattern-box strong{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#92400E;margin-bottom:4px;}
.intro-explanation{font-size:.9rem;color:var(--ink-soft);margin-bottom:20px;line-height:1.6;text-align:left;}
.intro-examples{display:flex;flex-direction:column;gap:10px;text-align:left;margin-bottom:24px;}
.intro-example{background:#F9F4F5;border-radius:10px;padding:12px 14px;}
.ex-zh{font-family:'Noto Sans SC',sans-serif;font-size:1.15rem;margin-bottom:2px;cursor:pointer;border-radius:4px;padding:2px 4px;transition:background .15s;}
.ex-zh:hover{background:rgba(192,57,43,.1);}
.ex-py{font-size:.8rem;color:var(--ink-soft);margin-bottom:2px;}
.ex-en{font-size:.85rem;color:var(--ink-soft);}
.continue-btn{background:var(--red);color:#fff;border:none;border-radius:var(--r);padding:14px 40px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;}
.continue-btn:hover{background:var(--red-dark);}
/* SPEAK */
.speak-main{text-align:center;padding:8px 0 16px;}
.speak-zh{font-family:'Noto Sans SC',sans-serif;font-size:2rem;line-height:1.5;margin-bottom:8px;cursor:pointer;border-radius:10px;padding:8px 12px;display:inline-block;transition:background .15s;}
.speak-zh:hover{background:var(--red-light);}
.speak-py{font-size:.95rem;color:var(--ink-soft);margin-bottom:4px;}
.speak-en{font-size:.9rem;color:var(--ink-faint);margin-bottom:12px;}
.audio-hint{font-size:.8rem;color:var(--ink-faint);margin:8px 0 4px;}
.speak-btns{display:flex;gap:12px;margin-top:16px;justify-content:center;}
.speak-correct{background:var(--green-bg);color:var(--green);border:2px solid #86EFAC;border-radius:var(--r);padding:12px 20px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;flex:1;max-width:200px;}
.speak-correct:hover{background:#BBF7D0;}
.speak-again{background:#F3F4F6;color:var(--ink-soft);border:2px solid #E5E7EB;border-radius:var(--r);padding:12px 20px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;flex:1;max-width:200px;}
.speak-again:hover{background:#E5E7EB;}
/* FILL */
.sentence-display{font-family:'Noto Sans SC',sans-serif;font-size:1.5rem;line-height:1.9;text-align:center;margin:8px 0 6px;}
.blank-box{display:inline-block;min-width:60px;border-bottom:3px solid var(--red);vertical-align:bottom;text-align:center;color:var(--red);font-weight:700;padding:0 6px;}
.sentence-py{text-align:center;font-size:.85rem;color:var(--ink-soft);margin-bottom:4px;}
.sentence-en{text-align:center;font-size:.84rem;color:var(--ink-faint);margin-bottom:18px;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option-btn{background:var(--card);border:2px solid #E8DEDE;border-radius:12px;padding:13px 10px;font-family:'Noto Sans SC',sans-serif;font-size:1.05rem;cursor:pointer;transition:all .15s;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;}
.option-btn:hover:not(:disabled):not(.correct):not(.wrong){border-color:var(--red);background:var(--red-light);}
.option-btn.selected{border-color:var(--red);background:var(--red-light);color:var(--red);}
.option-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);pointer-events:none;}
.option-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);pointer-events:none;}
.option-btn:disabled{cursor:default;}
/* POS */
.pos-word-display{text-align:center;margin-bottom:20px;}
.pos-word-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--red);color:#fff;border-radius:12px;padding:10px 24px;font-family:'Noto Sans SC',sans-serif;font-size:1.6rem;font-weight:700;box-shadow:0 4px 12px rgba(192,57,43,.3);}
.chip-py{font-size:.72rem;opacity:.85;font-family:'DM Sans',sans-serif;font-weight:400;}
.pos-instruction{text-align:center;font-size:.84rem;color:var(--ink-soft);margin-bottom:16px;}
.pos-sentence-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;margin-bottom:16px;min-height:56px;}
.pos-seg{font-family:'Noto Sans SC',sans-serif;font-size:1.35rem;color:var(--ink);padding:4px 2px;white-space:nowrap;}
.pos-marker{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px dashed var(--ink-faint);color:var(--ink-faint);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;margin:0 2px;flex-shrink:0;}
.pos-marker:hover{border-color:var(--red);color:var(--red);background:var(--red-light);border-style:solid;}
.pos-marker.selected{border-color:var(--red);color:#fff;background:var(--red);border-style:solid;}
.pos-marker.correct-pos{border-color:var(--green);color:#fff;background:var(--green);border-style:solid;}
.pos-marker.wrong-pos{border-color:var(--wrong);color:#fff;background:var(--wrong);border-style:solid;}
.pos-marker.correct-pos-unselected{border-color:var(--green);color:var(--green);border-style:solid;}
.pos-preview{text-align:center;min-height:30px;margin:4px 0 10px;}
.pos-preview-text{font-family:'Noto Sans SC',sans-serif;font-size:1.05rem;color:var(--ink-soft);}
.pos-preview-word{color:var(--red);font-weight:700;}
/* MULTI */
.multi-sentence{font-family:'Noto Sans SC',sans-serif;font-size:1.3rem;line-height:2.2;margin:10px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;}
.multi-seg{white-space:pre-wrap;font-family:'Noto Sans SC',sans-serif;}
.multi-blank{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;height:46px;border-radius:10px;border:2.5px dashed var(--ink-faint);color:var(--ink-faint);font-size:.8rem;cursor:pointer;transition:all .2s;padding:2px 8px;margin:0 2px;position:relative;}
.multi-blank.filled{border-style:solid;border-color:var(--red);background:var(--red-light);color:var(--red);}
.multi-blank.filled-dash{border-style:solid;border-color:#94A3B8;background:#F1F5F9;color:#64748B;}
.multi-blank.correct-blank{border-color:var(--green);background:var(--green-bg);color:var(--green);border-style:solid;pointer-events:none;}
.multi-blank.wrong-blank{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);border-style:solid;pointer-events:none;}
.blank-label{font-size:.62rem;font-weight:700;opacity:.7;font-family:'DM Sans',sans-serif;}
.blank-word{font-family:'Noto Sans SC',sans-serif;font-size:1rem;font-weight:700;}
.multi-bank-label{font-size:.76rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;text-align:center;}
.multi-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
.bank-tile{background:var(--card);border:2px solid #E8DEDE;border-radius:10px;padding:8px 16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:48px;}
.bank-tile:hover:not(.used){border-color:var(--red);background:var(--red-light);}
.bank-tile.held{border-color:var(--red);background:var(--red);color:#fff;}
.bank-tile.used{opacity:.3;cursor:default;pointer-events:none;}
.bank-tile.dash-tile{border-color:#94A3B8;color:#64748B;}
.bank-tile.dash-tile.held{background:#94A3B8;border-color:#94A3B8;color:#fff;}
.bank-tile .tile-zh{font-family:'Noto Sans SC',sans-serif;font-size:1.1rem;font-weight:700;}
.multi-en{text-align:center;font-size:.84rem;color:var(--ink-faint);margin-bottom:4px;}
/* WORD ORDER */
.wordorder-answer-area{min-height:60px;background:#FAF3F4;border:2px dashed #E8DEDE;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
.wordorder-answer-area.has-words{border-style:solid;border-color:var(--red-light);}
.answer-placeholder{color:var(--ink-faint);font-size:.84rem;width:100%;text-align:center;}
.wordorder-tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.word-tile{background:var(--card);border:2px solid #E8DEDE;border-radius:10px;padding:8px 13px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;}
.word-tile:hover{border-color:var(--red);background:var(--red-light);}
.word-tile.used{opacity:.3;cursor:default;background:#F5F0F0;pointer-events:none;}
.tile-zh{font-family:'Noto Sans SC',sans-serif;font-size:1.1rem;font-weight:500;}
.tile-py{font-size:.62rem;color:var(--ink-soft);}
.answer-tile{background:var(--red-light);border:2px solid var(--red);border-radius:10px;padding:8px 13px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.answer-tile:hover{background:#FCC2C2;}
.answer-tile.correct-tile{background:var(--green-bg);border-color:var(--green);pointer-events:none;}
.answer-tile.wrong-tile{background:var(--wrong-bg);border-color:var(--wrong);pointer-events:none;}
/* TRANSLATE */
.translate-zh{font-family:'Noto Sans SC',sans-serif;font-size:1.55rem;text-align:center;cursor:pointer;border-radius:10px;padding:8px 12px;display:inline-block;transition:background .15s;margin-bottom:4px;}
.translate-zh:hover{background:var(--red-light);}
.translate-py{text-align:center;font-size:.84rem;color:var(--ink-soft);margin-bottom:16px;}
.translate-center{text-align:center;}
/* SHARED */
.check-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);padding:13px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;transition:background .15s;}
.check-btn:hover:not(:disabled){background:var(--red-dark);}
.check-btn:disabled{background:#C8B8BC;cursor:default;}
.next-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:13px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;transition:background .15s;}
.next-btn:hover{background:#3D2E33;}
.feedback-bar{margin-top:12px;border-radius:12px;padding:12px 15px;display:flex;align-items:flex-start;gap:10px;font-weight:500;font-size:.9rem;}
.feedback-bar.correct{background:var(--green-bg);color:var(--green);}
.feedback-bar.wrong{background:var(--wrong-bg);color:var(--wrong);}
.feedback-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px;}
.feedback-detail{font-size:.82rem;opacity:.85;margin-top:3px;}
.audio-btn{background:var(--red-light);border:1.5px solid transparent;color:var(--red);border-radius:99px;padding:6px 14px;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s;margin-top:4px;}
.audio-btn:hover{background:#FCC2C2;border-color:var(--red);}
/* COMPLETE */
.complete{max-width:560px;margin:0 auto;padding:24px 16px 40px;}
.complete-card{background:var(--card);border-radius:20px;padding:36px 28px 28px;box-shadow:var(--shb);text-align:center;margin-bottom:20px;}
.complete-trophy{font-size:4rem;margin-bottom:12px;}
.complete-title{font-family:'Noto Serif SC',sans-serif;font-size:1.8rem;font-weight:700;color:var(--ink);margin-bottom:4px;}
.complete-sub{font-size:.9rem;color:var(--ink-soft);margin-bottom:24px;}
.score-big{font-size:5rem;font-weight:700;color:var(--red);font-family:'Noto Serif SC',sans-serif;line-height:1;}
.score-label{font-size:.84rem;color:var(--ink-soft);margin-bottom:8px;}
.high-score-badge{display:inline-block;background:var(--gold-light);color:var(--gold);border:1.5px solid #FDE68A;border-radius:99px;padding:4px 14px;font-size:.8rem;font-weight:600;margin-top:6px;}
.stats-row{display:flex;gap:12px;margin:22px 0 18px;}
.stat-box{flex:1;background:#FAF5F5;border-radius:12px;padding:14px 10px;text-align:center;}
.stat-num{font-size:1.6rem;font-weight:700;color:var(--ink);}
.stat-label{font-size:.74rem;color:var(--ink-soft);margin-top:2px;}
.complete-actions{display:flex;flex-direction:column;gap:10px;}
.action-btn{border-radius:var(--r);padding:14px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:2px solid transparent;transition:all .15s;}
.action-btn.primary{background:var(--red);color:#fff;border-color:var(--red);}
.action-btn.primary:hover{background:var(--red-dark);}
.action-btn.secondary{background:var(--card);color:var(--ink);border-color:#E8DEDE;}
.action-btn.secondary:hover{border-color:var(--red);color:var(--red);}

/* ── MIC / PRONUNCIATION UI ─────────────────────────────────────────── */
.mic-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:1rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s;}
.mic-btn:hover{background:var(--red-dark);transform:translateY(-1px);}
.mic-btn.listening{background:#7F1D1D;animation:pulseBtn 1.2s ease-in-out infinite;}
.mic-stop-btn{width:100%;background:#7F1D1D;color:#fff;border:none;border-radius:var(--r);padding:13px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:12px;transition:background .15s;}
.mic-stop-btn:hover{background:#991B1B;}

.mic-error-card{background:#FEF2F2;border:1.5px solid #FECACA;border-radius:14px;padding:18px 16px;margin:12px 0 4px;}
.mic-error-icon{font-size:2rem;margin-bottom:8px;text-align:center;}
.mic-error-title{font-weight:700;font-size:1rem;color:var(--wrong);margin-bottom:10px;text-align:center;}
.mic-error-body{font-size:.85rem;color:#7F1D1D;line-height:1.6;}
.mic-error-body ol{padding-left:18px;margin:8px 0;}
.mic-error-body ol li{margin-bottom:5px;}
.mic-error-body code{background:rgba(127,29,29,.1);border-radius:4px;padding:1px 5px;font-size:.82rem;}

/* Simple pulsing mic icon during recording (pure CSS, no data-driven flicker) */
.mic-pulse-wrap{position:relative;width:88px;height:88px;margin:20px auto 12px;display:flex;align-items:center;justify-content:center;}
.mic-pulse-ring{position:absolute;width:100%;height:100%;border-radius:50%;background:var(--red);opacity:.18;animation:micPulse 1.6s ease-out infinite;}
.mic-pulse-ring::before{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--red);opacity:.35;animation:micPulse 1.6s ease-out infinite .25s;}
.mic-pulse-icon{position:relative;z-index:1;font-size:2.2rem;}
@keyframes micPulse{0%{transform:scale(.7);opacity:.5;}100%{transform:scale(1.35);opacity:0;}}
.live-transcript{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:10px;padding:10px 12px;margin:4px 0 8px;font-size:1.15rem;text-align:center;color:#1D4ED8;}
.live-transcript-placeholder{text-align:center;color:var(--ink-faint);font-size:.85rem;margin:4px 0 8px;}
.recog-status-line{text-align:center;font-size:.76rem;color:var(--ink-faint);margin:2px 0 6px;}
.recog-status-line.warn{color:var(--wrong);font-weight:500;}
.heard-line{text-align:center;font-size:1rem;color:var(--ink-soft);margin:10px 0 4px;}
.heard-line .zh{font-size:1.15rem;color:var(--ink);font-weight:500;}
.heard-line.faint{color:var(--ink-faint);font-size:.85rem;}
/* Playback button */
.playback-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#EFF6FF;border:1.5px solid #BFDBFE;color:#1D4ED8;border-radius:10px;padding:10px 16px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;margin-top:10px;transition:all .15s;}
.playback-btn:hover{background:#DBEAFE;}
.playback-btn.playing{background:#DBEAFE;border-color:#93C5FD;}
/* Transcript comparison — closeness coloring (5 tiers) */
.tc-char-col{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px;}
.tc-char{cursor:pointer;border-radius:4px;}
.tc-char.sub{color:var(--ink);background:#F3F4F6;padding:0 2px;}
.tc-char.close-tone{color:#0F766E;background:#CCFBF1;padding:0 2px;}
.tc-char.close-sound{color:#92400E;background:#FEF3C7;padding:0 2px;}
.tc-sub-hint{font-size:.6rem;color:var(--ink-faint);line-height:1;margin-top:1px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;}
.tc-extra{font-size:.78rem;color:var(--ink-faint);margin-top:6px;text-align:center;}
.tc-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:.68rem;color:var(--ink-faint);}
.tc-leg-item{display:flex;align-items:center;gap:4px;}
.tc-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.tc-dot.good{background:var(--green);}
.tc-dot.close-tone{background:#0F766E;}
.tc-dot.close-sound{background:#CA8A04;}
.tc-dot.ok{background:var(--ink);}
.tc-dot.poor{background:var(--wrong);}
.self-report-link{display:block;width:100%;background:none;border:none;color:var(--ink-faint);font-size:.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;text-decoration:underline;text-underline-offset:3px;padding:4px;}
.self-report-link:hover{color:var(--ink-soft);}
.mic-status{display:flex;align-items:center;gap:8px;font-size:.83rem;color:var(--ink-soft);margin:6px 0 10px;justify-content:center;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulseBtn 1s ease-in-out infinite;}
@keyframes pulseBtn{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.7;transform:scale(.95);}}
.transcript-compare{background:#FAF3F4;border-radius:12px;padding:12px 14px;margin:12px 0 6px;}
.tc-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:.85rem;}
.tc-label{color:var(--ink-faint);font-size:.76rem;width:60px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em;}
.tc-chars{font-family:'Noto Sans SC',sans-serif;font-size:1.2rem;display:flex;flex-wrap:wrap;gap:2px;}
.tc-char.match{color:var(--green);}
.tc-char.miss{color:var(--wrong);text-decoration:underline;text-decoration-color:var(--wrong);}
.tc-char.neutral{color:var(--ink-soft);}
.tc-pct{font-size:.82rem;color:var(--ink-soft);text-align:center;margin-top:4px;}
.speak-result-btns{display:flex;gap:10px;margin-top:14px;}
.speak-result-btns .speak-correct{flex:1;}
.speak-result-btns .speak-again{flex:1;}
.speak-py-large{font-size:1.05rem;color:var(--ink-soft);margin:4px 0 10px;line-height:1.7;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(.9);opacity:0;}60%{transform:scale(1.04);}100%{transform:scale(1);opacity:1;}}
.fade-in{animation:fadeSlide .28s ease;}
.pop-in{animation:pop .28s ease;}
@media(max-width:480px){.home-title{font-size:1.8rem;}.speak-zh{font-size:1.6rem;}.options-grid{grid-template-columns:1fr 1fr;}.pos-seg{font-size:1.1rem;}.multi-sentence{font-size:1.05rem;}}

// Best-effort char-by-char pinyin lookup (covers every character used in
// this app's own lesson content). Characters outside that set — or where
// the true reading depends on word context the recognizer doesn't give us
// (a handful of polyphonic characters) — show without a reading rather
// than guessing wrong. This is a debugging aid, not a scored feature.
function charsToPinyin(text) {
  if(!text) return '';
  const clean = text.replace(/[。，？！,.?!'" \r\n]/g,'');
  return [...clean].map(ch => HANZI_PINYIN[ch] || ch).join(' ');

{id:3,title:'Degree, Scope & "What About"',subtitle:'很, 都 and 呢',
 grammar:[
  {zh:'很',py:'hěn',meaning:'very (degree adverb)',pattern:'Subject + 很 + Adjective',
   explanation:'Adjective predicates usually need a degree word like 很. Without it, the sentence sounds like a comparison. Here 很 can be mild or unstressed.',
   examples:[{zh:'她很漂亮。',py:'Tā hěn piàoliang.',en:'She is (very) pretty.'},{zh:'今天很热。',py:'Jīntiān hěn rè.',en:'Today is (very) hot.'}]},
  {zh:'都',py:'dōu',meaning:'all / both',pattern:'Subject(s) + 都 + Verb/Adjective',
   explanation:'都 means "all" or "both." It always comes BEFORE the verb/adjective and AFTER the subject. It refers back to a plural or listed subject.',
   examples:[{zh:'我们都是学生。',py:'Wǒmen dōu shì xuésheng.',en:'We are all students.'},{zh:'他们都很忙。',py:'Tāmen dōu hěn máng.',en:'They are all very busy.'}]},
  {zh:'呢',py:'ne',meaning:'"What about…?" / continuation',pattern:'[Topic] + 呢？',
   explanation:'呢 at the end of a short phrase asks "what about…?" or softly continues a conversation topic.',

{id:4,title:'Location & Basic Modals',subtitle:'在, 想 and 可以',
 grammar:[

   examples:[{zh:'我在学校。',py:'Wǒ zài xuéxiào.',en:'I am at school.'},{zh:'他在图书馆学习。',py:'Tā zài túshūguǎn xuéxí.',en:'He studies in the library.'}]},

{id:5,title:'Ability & Intention',subtitle:'会, 能 and 要',
 grammar:[
  {zh:'会',py:'huì',meaning:'can (learned skill / will)',pattern:'Subject + 会 + Verb',
   explanation:'会 expresses a learned ability — something you know how to do. Also used for future probability ("will happen").',
   examples:[{zh:'我会说中文。',py:'Wǒ huì shuō Zhōngwén.',en:'I can speak Chinese.'},{zh:'她会游泳。',py:'Tā huì yóuyǒng.',en:'She can swim.'}]},
  {zh:'能',py:'néng',meaning:'can (physical ability / circumstance)',pattern:'Subject + 能 + Verb',
   explanation:'能 expresses physical capability or ability based on circumstances. "I\'m able to (given the situation)."',
   examples:[{zh:'你能吃辣的吗？',py:'Nǐ néng chī là de ma?',en:'Can you eat spicy food?'},{zh:'我现在不能说话。',py:'Wǒ xiànzài bù néng shuōhuà.',en:"I can't speak right now."}]},
  {zh:'要',py:'yào',meaning:'want / will / need to',pattern:'Subject + 要 + Verb/Noun',
   explanation:'要 has multiple uses: wanting something, intending to do something, or necessity. Context makes meaning clear.',
   examples:[{zh:'我要一杯茶。',py:'Wǒ yào yī bēi chá.',en:'I want a cup of tea.'},{zh:'你要多休息。',py:'Nǐ yào duō xiūxi.',en:'You need to rest more.'}]}],

 grammar:[
  {zh:'了',py:'le',meaning:'completion / changed situation',pattern:'Verb + 了 (done)  ·  Sentence + 了 (new state)',
   explanation:'了 after a verb marks a completed action. At sentence end, it marks a new situation or changed state.',
   examples:[{zh:'我吃了早饭。',py:'Wǒ chī le zǎofàn.',en:'I ate breakfast.'},{zh:'他来了。',py:'Tā lái le.',en:"He's here (he has come)."}]},
  {zh:'过',py:'guò',meaning:'have ever (experience)',pattern:'Verb + 过',
   explanation:'过 after a verb means "have ever done" — a past experience. Negated with 没(有): 我没吃过寿司.',
   examples:[{zh:'我去过北京。',py:'Wǒ qù guò Běijīng.',en:'I have been to Beijing.'},{zh:'你吃过日本菜吗？',py:'Nǐ chī guò Rìběn cài ma?',en:'Have you ever eaten Japanese food?'}]},

   explanation:'正在 before a verb marks an ongoing action happening right now. Often followed by 呢 at sentence end.',
   examples:[{zh:'我正在吃饭。',py:'Wǒ zhèngzài chīfàn.',en:"I'm eating (right now)."},{zh:'她正在看书呢。',py:'Tā zhèngzài kàn shū ne.',en:"She's reading right now."}]}],

{id:7,title:'The Three "De" Particles',subtitle:'的, 得 and 地',
 grammar:[
  {zh:'的',py:'de',meaning:'possessive / noun modifier',pattern:'Modifier + 的 + Noun',
   explanation:'的 links modifiers to nouns. Possession (我的书 = my book) or description (漂亮的花 = beautiful flower).',
   examples:[{zh:'这是我的书。',py:'Zhè shì wǒ de shū.',en:'This is my book.'},{zh:'漂亮的花',py:'piàoliang de huā',en:'beautiful flower'}]},
  {zh:'得',py:'de',meaning:'result / degree complement',pattern:'Verb + 得 + Adjective',
   explanation:'得 links a verb to a complement describing the result or quality of the action. 说得很好 = speaks well.',
   examples:[{zh:'她说得很好。',py:'Tā shuō de hěn hǎo.',en:'She speaks (it) very well.'},{zh:'他跑得很快。',py:'Tā pǎo de hěn kuài.',en:'He runs very fast.'}]},
  {zh:'地',py:'de',meaning:'adverb marker',pattern:'Adjective/Adverb + 地 + Verb',
   explanation:'地 turns an adjective into an adverb that modifies the verb that follows it. 高兴地唱 = sing happily.',
   examples:[{zh:'她高兴地唱歌。',py:'Tā gāoxìng de chànggē.',en:'She sings happily.'},{zh:'他认真地工作。',py:'Tā rènzhēn de gōngzuò.',en:'He works seriously.'}]}],

{id:8,title:'Making Comparisons',subtitle:'比, 最 and 跟...一样',
 grammar:[
  {zh:'比',py:'bǐ',meaning:'more…than (comparative)',pattern:'A + 比 + B + Adjective',
   explanation:'比 compares two things: 我比你高 = I am taller than you. Do NOT add 更 right after 比.',
   examples:[{zh:'我比你高。',py:'Wǒ bǐ nǐ gāo.',en:'I am taller than you.'},{zh:'苹果比香蕉贵。',py:'Píngguǒ bǐ xiāngjiāo guì.',en:'Apples are more expensive than bananas.'}]},
  {zh:'最',py:'zuì',meaning:'most / -est (superlative)',pattern:'最 + Adjective / Verb',
   explanation:'最 before an adjective makes it superlative: 最好 = best, 最喜欢 = like most.',
   examples:[{zh:'她是最聪明的学生。',py:'Tā shì zuì cōngmíng de xuésheng.',en:'She is the most intelligent student.'},{zh:'我最喜欢吃面条。',py:'Wǒ zuì xǐhuān chī miàntiáo.',en:'I like eating noodles the most.'}]},

// LESSON 9 – 因为...所以 / 虽然...但是 / 如果...就
// ─────────────────────────────────────────────
{id:9,title:'Complex Sentences',subtitle:'因为...所以, 虽然...但是 and 如果...就',
 grammar:[
  {zh:'因为...所以',py:'yīnwèi...suǒyǐ',meaning:'because…therefore',pattern:'因为 + Reason, 所以 + Result',
   explanation:'因为 introduces a reason, 所以 introduces the result. Either can be omitted in context, but not both.',
   examples:[{zh:'因为下雨，所以我没去。',py:'Yīnwèi xià yǔ, suǒyǐ wǒ méi qù.',"en":"Because it rained, I didn't go."},{zh:'因为他很忙，所以不能来。',py:'Yīnwèi tā hěn máng, suǒyǐ bù néng lái.',en:"Because he is busy, he can't come."}]},
  {zh:'虽然...但是',py:'suīrán...dànshì',meaning:'although…but',pattern:'虽然 + Concession, 但是 + Contrast',
   explanation:'虽然 introduces a concession, 但是 the contrasting fact. Unlike English, Chinese keeps subjects in both clauses.',
   examples:[{zh:'虽然很贵，但是很好吃。',py:'Suīrán hěn guì, dànshì hěn hǎochī.',en:"Although it's expensive, it's delicious."},{zh:'虽然他很累，但是没休息。',py:'Suīrán tā hěn lèi, dànshì méi xiūxi.',en:"Although he was tired, he didn't rest."}]},
  {zh:'如果...就',py:'rúguǒ...jiù',meaning:'if…then',pattern:'如果 + Condition, 就 + Result',
   explanation:'如果 sets up a condition; 就 introduces the result. 就 can stand alone when context is clear.',
   examples:[{zh:'如果你来，我就很高兴。',py:'Rúguǒ nǐ lái, wǒ jiù hěn gāoxìng.',en:'If you come, I will be happy.'},{zh:'如果明天下雨，我就不去了。',py:'Rúguǒ míngtiān xià yǔ, wǒ jiù bù qù le.',en:"If it rains tomorrow, I won't go."}]}],

// LESSON 10 – 还是/或者, 一边...一边, 把
// ─────────────────────────────────────────────
{id:10,title:'Advanced Structures',subtitle:'还是/或者, 一边...一边 and 把',
 grammar:[
  {zh:'还是 / 或者',py:'háishi / huòzhě',meaning:'"or" (question vs. statement)',pattern:'A + 还是 + B？ (question)  ·  A + 或者 + B (statement)',
   explanation:'还是 is for questions (A or B?). 或者 is for statements (either A or B). Mixing them is a common error.',

// FIX: reuse ONE persistent Audio element for every play, instead of
// creating a fresh Audio() each call. Mobile browsers pay a "cold audio
// route" warm-up penalty (eating the first fraction-of-a-second of
// content) whenever a NEW media element starts playing for the first
// time — a one-off "unlock" element (the previous approach) never
// transfers that warm state to later, different Audio objects. Keeping
// the SAME element alive and just swapping its .src keeps the route warm
// for every subsequent play.
let _ttsAudio = null;
let _audioUnlocked = false;

function _getTTSAudio() {
  if (!_ttsAudio) { _ttsAudio = new Audio(); _ttsAudio.preload = 'auto'; }
  return _ttsAudio;
}

function _unlockAudioOnce() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  const a = _getTTSAudio();
  try {
    a.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAAA=";
    a.play().catch(()=>{});
  } catch(e) {}
}
document.addEventListener('touchstart', _unlockAudioOnce, {once:true, passive:true});
document.addEventListener('click', _unlockAudioOnce, {once:true});
document.addEventListener('keydown', _unlockAudioOnce, {once:true});

function speakChinese(text) {
  if (!text) return;
  _unlockAudioOnce();   // establishes _ttsAudio + warms it if this is the very first call
  try {
    const audio = _getTTSAudio();
    audio.pause();
    const url = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q=' + encodeURIComponent(text);
    let played = false;
    const doPlay = () => {
      if (played) return; played = true;
      audio.play().catch(() => _browserSpeak(text));
    };
    // FIX: wait for the browser to confirm it actually has enough audio
    // buffered ('canplay') before starting playback. Calling play()
    // immediately after load() — with zero buffer — was the real bug:
    // the element starts "playing" against an empty buffer, and the
    // opening fraction-of-a-second of real audio gets lost by the time
    // any data arrives. This was clipping audio on desktop Chrome too,
    // not just mobile, which is why the mobile-only "hardware warm-up"
    // theory alone wasn't the full explanation.
    audio.oncanplay = doPlay;
    audio.onerror = () => { if(!played) _browserSpeak(text); };
    audio.src = url;
    audio.load();
    setTimeout(() => { if(!played) doPlay(); }, 2500);   // slow-network fallback
  } catch(e) { _browserSpeak(text); }
}
function _browserSpeak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function parsePinyinSyllables(py) {
  const clean = py.replace(/[。，？！,.?!'"\r\n]/g,' ').trim();
  const words = clean.split(/\s+/).filter(Boolean);
  const T1='āēīōūǖĀĒĪŌŪǕ', T2='áéíóúǘÁÉÍÓÚǗ', T3='ǎěǐǒǔǚǍĚǏǑǓǙ', T4='àèìòùǜÀÈÌÒÙǛ';
  return words.map(w => {
    let tone=0;
    for(const c of w){
      if(T1.includes(c)){tone=1;break;} if(T2.includes(c)){tone=2;break;}
      if(T3.includes(c)){tone=3;break;} if(T4.includes(c)){tone=4;break;}
    }
    return {syllable:w, tone};
  });
}

const TONE_MAP = {
  'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],
  'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
  'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],
  'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
  'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],
  'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4],
};
function analyzePinyin(py) {
  let base='', tone=0;
  for(const ch of py){ if(TONE_MAP[ch]){base+=TONE_MAP[ch][0]; tone=TONE_MAP[ch][1];} else base+=ch; }
  return {base, tone};
}
const PY_INITIALS=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
function parseInitialFinal(base){
  for(const ini of PY_INITIALS) if(base.startsWith(ini)) return {initial:ini, final:base.slice(ini.length)};
  return {initial:'', final:base};
}
const CONFUSABLE_INITIALS=[['zh','z'],['ch','c'],['sh','s'],['n','l'],['f','h'],['r','l']];
function initialsConfusable(a,b){ if(a===b) return true; return CONFUSABLE_INITIALS.some(pr=>pr.includes(a)&&pr.includes(b)); }
function editDist1(a,b){
  if(a===b) return true;
  if(Math.abs(a.length-b.length)>1) return false;
  if(a.length===b.length){ let d=0; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) d++; return d<=1; }
  const [lo,sh]=a.length>b.length?[a,b]:[b,a];
  for(let i=0;i<lo.length;i++) if(lo.slice(0,i)+lo.slice(i+1)===sh) return true;
  return false;
}
function soundsSimilar(baseA,baseB){
  if(baseA===baseB) return true;
  const {initial:iA,final:fA}=parseInitialFinal(baseA), {initial:iB,final:fB}=parseInitialFinal(baseB);
  if(iA===iB && editDist1(fA,fB)) return true;
  if(fA===fB && initialsConfusable(iA,iB)) return true;
  return false;
}

// ── ALIGNMENT-BASED TRANSCRIPT COMPARISON ────────────────────────────────
// Edit-distance alignment (not naive positional matching) — a single
// dropped/extra character no longer cascades into everything after it
// showing wrong.
function _alignChars(expArr, heardArr) {
  const n=expArr.length, m=heardArr.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++) dp[i][0]=i;
  for(let j=0;j<=m;j++) dp[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    dp[i][j] = expArr[i-1]===heardArr[j-1]
      ? dp[i-1][j-1]
      : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
  }
  let i=n, j=m; const ops=[];
  while(i>0||j>0){
    if(i>0&&j>0&&expArr[i-1]===heardArr[j-1]&&dp[i][j]===dp[i-1][j-1]){
      ops.push({type:'match',e:expArr[i-1],h:heardArr[j-1]}); i--; j--;
    } else if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+1){
      ops.push({type:'sub',e:expArr[i-1],h:heardArr[j-1]}); i--; j--;
    } else if(i>0&&dp[i][j]===dp[i-1][j]+1){
      ops.push({type:'del',e:expArr[i-1],h:null}); i--;
    } else {
      ops.push({type:'ins',e:null,h:heardArr[j-1]}); j--;
    }
  }
  return ops.reverse();
}

// Closeness tiers, using pinyin (when both chars are in our dictionary):
//  good       — same char, OR a different char with IDENTICAL pinyin+tone
//               (a true homophone like 她/他 — this is NOT a pronunciation
//               error, the recognizer just picked the "other" character
//               that sounds identical, so it counts fully correct)
//  closeTone  — same base syllable, different tone (e.g. mǎi vs mài)
//  closeSound — different but phonetically similar syllable (shared
//               initial + near-identical final, or vice versa)
//  ok         — recognizer heard something at that slot but we can't
//               positively confirm any similarity (unknown char, or a
//               genuinely different sound) — benefit of the doubt
//  poor       — nothing recognized there at all (deletion)
const GRADE_WEIGHT = {good:1, closeTone:0.8, closeSound:0.6, ok:0.5, poor:0};

function compareTranscript(expected, heard) {
  const norm = s => [...s.replace(/[。，？！,.?!'" \r\n]/g,'')];
  const eArr = norm(expected), hArr = norm(heard||'');
  if(hArr.length===0){
    return { expectedRow: eArr.map(ch=>({ch,grade:'poor'})), extras:[], pct:0, total:eArr.length||1 };
  }
  const ops=_alignChars(eArr,hArr);
  const expectedRow=[]; const extras=[]; let weightSum=0;
  ops.forEach(op=>{
    if(op.type==='match'){
      weightSum+=1; expectedRow.push({ch:op.e,grade:'good'});
    } else if(op.type==='sub'){
      let grade='ok';
      const pyE=HANZI_PINYIN[op.e], pyH=HANZI_PINYIN[op.h];
      if(pyE && pyH){
        const {base:bE,tone:tE}=analyzePinyin(pyE), {base:bH,tone:tH}=analyzePinyin(pyH);
        if(bE===bH && tE===tH) grade='good';
        else if(bE===bH) grade='closeTone';
        else if(soundsSimilar(bE,bH)) grade='closeSound';
      }
      weightSum+=GRADE_WEIGHT[grade];
      expectedRow.push({ch:op.e, grade, heardCh:op.h});
    } else if(op.type==='del'){
      expectedRow.push({ch:op.e,grade:'poor'});
    } else if(op.type==='ins'){
      extras.push(op.h);
    }
  });
  const total=eArr.length||1;
  const pct=Math.round(weightSum/total*100);
  return {expectedRow, extras, pct, total};
}

// Each character is clickable — tap the (colored) expected character to
// hear the correct pronunciation, tap the small hint character below a
// mismatched one to hear what got recognized instead, so you can A/B
// compare the two sounds directly.
function renderTranscriptCompare(expected, heard) {
  if(!heard){
    return `<div class="transcript-compare"><div class="tc-pct" style="color:var(--ink-faint)">Nothing recognized — try again, speak a bit louder, or use "Self-report"</div></div>`;
  }
  const r = compareTranscript(expected, heard);
  const gradeClass = {good:'match', closeTone:'close-tone', closeSound:'close-sound', ok:'sub', poor:'miss'};
  const expHtml = r.expectedRow.map(item=>{
    const cls = gradeClass[item.grade] || 'sub';
    const eEsc = item.ch.replace(/'/g,"\\'");
    const hint = (item.grade!=='good' && item.heardCh)
      ? `<span class="tc-sub-hint" onclick="speakChinese('${item.heardCh.replace(/'/g,"\\'")}')">${item.heardCh}</span>` : '';
    return `<span class="tc-char-col"><span class="tc-char ${cls}" onclick="speakChinese('${eEsc}')">${item.ch}</span>${hint}</span>`;
  }).join('');
  const extraHtml = r.extras.length
    ? `<div class="tc-extra">+ also heard: <span class="zh">${r.extras.join('')}</span></div>` : '';
  return `<div class="transcript-compare">
    <div class="tc-row"><span class="tc-label">Expected</span><span class="tc-chars">${expHtml}</span></div>
    ${extraHtml}
    <div class="tc-pct"><strong>${r.pct}%</strong> close match</div>
    <div class="tc-legend">
      <span class="tc-leg-item"><span class="tc-dot good"></span>matched</span>
      <span class="tc-leg-item"><span class="tc-dot close-tone"></span>close (tone)</span>
      <span class="tc-leg-item"><span class="tc-dot close-sound"></span>close (sound)</span>
      <span class="tc-leg-item"><span class="tc-dot poor"></span>not heard</span>
    </div>
    <div style="font-size:.72rem;color:var(--ink-faint);text-align:center;margin-top:4px">Tap a character to hear it — tap the small hint below a colored one to compare</div>
  </div>`;
}

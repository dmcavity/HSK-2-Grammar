  if(MIC.phase==='requesting'){
    return `<div class="prompt-card pop-in"><div class="prompt-type-label">🎙 Speak Aloud</div>
      <div class="speak-main"><div class="speak-zh">${p.zh}</div><div class="speak-py speak-py-large">${p.py}</div></div>
      <div class="mic-status">Starting microphone…</div>
      <div style="font-size:.74rem;color:var(--ink-faint);text-align:center;margin-top:4px">Allow microphone access if prompted</div>
    </div>`;
  }

  // ── LISTENING — simple pulsing mic icon, no jumpy visuals ──
  if(MIC.phase==='listening'){
    const interimLine = MIC.interim
      ? `<div class="live-transcript">Hearing: <span class="zh">${MIC.interim}</span></div>`
      : `<div class="live-transcript-placeholder">Listening…</div>`;
    const statusLabels = {
      idle:'Starting…', listening:'Recognizer active', 'speech-detected':'Speech detected',
      error:'Recognizer error: '+(MIC.recogError||'?'), ended:'Recognizer finishing…',
      unsupported:'Speech recognition unavailable in this browser'
    };
    const statusLine = `<div class="recog-status-line${MIC.recogStatus==='error'||MIC.recogStatus==='unsupported'?' warn':''}">${statusLabels[MIC.recogStatus]||MIC.recogStatus}</div>`;
    return `<div class="prompt-card pop-in"><div class="prompt-type-label">🎙 Speak Aloud — Recording</div>
      <div class="speak-main">
        <div class="speak-zh" onclick="speakChinese('${zhEsc}')">${p.zh}</div>
        <div class="speak-py speak-py-large">${p.py}</div>
      </div>
      <div class="mic-pulse-wrap"><div class="mic-pulse-ring"></div><div class="mic-pulse-icon">🎙</div></div>
      ${statusLine}
      ${interimLine}
      <button class="mic-stop-btn" onclick="manualStopMic('${zhEsc}','${pyEsc}')">⏹ Done Speaking</button>
    </div>`;
  }

  // ── SELF-REPORT FALLBACK ──
  if(MIC.phase==='self-report'){
    return `<div class="prompt-card pop-in"><div class="prompt-type-label">🎙 Speak Aloud</div>
      <div class="speak-main">
        <div class="speak-zh" onclick="speakChinese('${zhEsc}')">${p.zh}</div>
        <div class="speak-py">${p.py}</div><div class="speak-en">${p.en}</div>
        <button class="audio-btn" onclick="speakChinese('${zhEsc}')">🔊 Hear it again</button>
      </div>
      <div class="speak-btns">
        <button class="speak-correct" onclick="scoreMicResult(true)">✓ I said it correctly</button>
        <button class="speak-again" onclick="scoreMicResult(false)">↺ Needs more practice</button>
      </div>
    </div>`;
  }

  // ── DONE (mic result) — clean, no debug panel ──
  if(MIC.phase==='done'){
    const r = MIC.transcript ? compareTranscript(p.zh, MIC.transcript) : null;
    const perfectMatch = r && r.pct>=95;
    const goodMatch    = r && r.pct>=65;

    const playbackBtn=_playbackURL
      ? `<button class="playback-btn" id="playback-btn" onclick="playbackRecording()">🎧 Play back my recording</button>`
      : '';

    // Speech recognition genuinely isn't producing a transcript yet even
    // after switching to continuous:false, so this shows exactly which
    // failure mode is occurring instead of guessing again — a single
    // clear line, not the old full debug panel.
    let noRecogReason = '';
    if(!MIC.recogSupported){
      noRecogReason = ' — speech recognition API not available in this browser/context';
    } else if(MIC.recogError){
      noRecogReason = ' — error: "' + MIC.recogError + '"';
    } else if(MIC.recogStatus === 'idle'){
      noRecogReason = ' — recognizer never started';
    } else {
      noRecogReason = ' — recognizer ran (status: ' + MIC.recogStatus + ') but returned no text';
    }
    const heardLine = MIC.transcript
      ? `<div class="heard-line">Heard: <span class="zh" onclick="speakChinese('${MIC.transcript.replace(/'/g,"\\'")}')">${MIC.transcript}</span></div>`
      : `<div class="heard-line faint">Nothing recognized${noRecogReason}</div>`;

    const actionHtml = perfectMatch
      ? `<div class="feedback-bar correct" style="margin-top:12px"><span class="feedback-icon">✅</span><div><div>Great match — nicely done!</div></div></div>
         <button class="next-btn" onclick="scoreMicResult(true)">Next →</button>`
      : `<div style="font-size:.82rem;color:var(--ink-soft);margin:10px 0 6px;text-align:center">${goodMatch?'Pretty close — how do you feel about it?':'Not a strong match — try again or continue:'}</div>
         <div class="speak-result-btns">
           <button class="speak-correct" onclick="scoreMicResult(true)">✓ Count it correct</button>
           <button class="speak-again" onclick="retryMic('${zhEsc}','${pyEsc}')">↺ Try again</button>
         </div>`;

    return `<div class="prompt-card pop-in"><div class="prompt-type-label">🎙 Speak Aloud — Result</div>
      <div class="speak-main">
        <div class="speak-zh" onclick="speakChinese('${zhEsc}')">${p.zh}</div>
        <div class="speak-py">${p.py}</div>
        <button class="audio-btn" onclick="speakChinese('${zhEsc}')">🔊 Hear target again</button>
      </div>
      ${heardLine}
      ${playbackBtn}
      ${MIC.transcript ? renderTranscriptCompare(p.zh, MIC.transcript) : ''}
      ${actionHtml}
    </div>`;
  }

  // ── ERROR ──
  if(MIC.phase==='error'){
    const et = MIC.errorType || 'unknown';
    const msgs = {
      denied: {
        icon:'🔒', title:'Microphone access blocked',
        body:`<p>Chrome remembered a previous "deny." Here's how to fix it on Android:</p>
          <ol><li>Tap the <strong>lock icon</strong> in the address bar</li>
          <li>Tap <strong>Permissions → Microphone</strong></li>
          <li>Switch to <strong>Allow</strong></li>
          <li>Tap <strong>Reload</strong> below</li></ol>
          <p style="margin-top:8px">Or: Android Settings → Apps → Chrome → Permissions → Microphone → Allow</p>`,
        btn:'↺ Reload page'
      },
      notfound: { icon:'🎤', title:'No microphone found', body:`<p>This device doesn't appear to have a microphone, or it isn't connected.</p>`, btn:null },
      inuse: { icon:'⚠️', title:'Microphone is in use', body:`<p>Another app is using the microphone. Close any apps using audio and try again.</p>`, btn:'Try Again' },
      insecure: { icon:'🔐', title:'Microphone requires HTTPS', body:`<p>Microphone access only works over <strong>HTTPS</strong>.</p><p style="margin-top:6px">Opening the file directly (<code>file://</code>) won't work — host on GitHub Pages instead.</p>`, btn:null },
      unknown: { icon:'❓', title:'Microphone unavailable', body:`<p>Something went wrong. Check Chrome has mic permission in Android Settings → Apps → Chrome → Permissions.</p>`, btn:'Try Again' },
    };
    const m = msgs[et] || msgs.unknown;
    const reloadBtn = et==='denied'
      ? `<button class="mic-btn" onclick="location.reload()" style="margin-top:14px">${m.btn}</button>`
      : m.btn ? `<button class="mic-btn" onclick="resetMicAndRender()" style="margin-top:14px">${m.btn}</button>` : '';
    return `<div class="prompt-card pop-in"><div class="prompt-type-label">🎙 Speak Aloud</div>
      <div class="mic-error-card">
        <div class="mic-error-icon">${m.icon}</div>
        <div class="mic-error-title">${m.title}</div>
        <div class="mic-error-body">${m.body}</div>
      </div>
      ${reloadBtn}
      <button class="self-report-link" onclick="showSelfReport()">Skip mic — self-report instead</button>
    </div>`;
  }
}

// ── MIC SESSION CONTROL ────────────────────────────────────────────────
// Simplified: only getUserMedia (for MediaRecorder playback) + speech
// recognition. The old AudioContext/AnalyserNode pipeline existed solely
// to drive the volume-meter/waveform visuals, which were removed for
// being distracting — dropping it also means one fewer simultaneous
// consumer of the microphone stream.
async function startMicSession(zhEsc, pyEsc) {
  _pendingPy = pyEsc;
  MIC = {phase:'requesting', transcript:'', interim:'', recogStatus:'idle', recogError:'', error:''};
  render();

  // 1. Secure context check (getUserMedia requires HTTPS or localhost)
  if(!window.isSecureContext){
    MIC = {...MIC, phase:'error', errorType:'insecure'};
    render(); return;
  }

  // 1b. Microphone
  try {
    _micStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  } catch(e) {
    const t = e.name || e.constructor?.name || '';
    let errorType = 'unknown';
    if(t==='NotAllowedError'||t==='PermissionDeniedError') errorType='denied';
    else if(t==='NotFoundError'||t==='DevicesNotFoundError') errorType='notfound';
    else if(t==='NotReadableError'||t==='TrackStartError') errorType='inuse';
    else if(t==='SecurityError') errorType='insecure';
    MIC = {...MIC, phase:'error', errorType};
    render(); return;
  }

  // MediaRecorder for playback
  _recordedChunks=[]; _playbackURL=null;
  try {
    const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg',''].find(m=>!m||MediaRecorder.isTypeSupported(m))||'';
    _mediaRecorder=new MediaRecorder(_micStream, mime?{mimeType:mime}:{});
    _mediaRecorder.ondataavailable=e=>{ if(e.data&&e.data.size>0) _recordedChunks.push(e.data); };
    _mediaRecorder.start(200);
  } catch(e){ _mediaRecorder=null; }

  _recordStart=Date.now();
  MIC.phase='listening'; render();

  // Speech recognition — every lifecycle event surfaced (not swallowed),
  // interim results enabled so you see live text as you speak.
  MIC.recogSupported = _micSpeechOK();
  if(MIC.recogSupported){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    _micRecognizer=new SR();
    _micRecognizer.lang='zh-CN';
    // continuous:false is the reliable choice here — we want ONE phrase,
    // graded once. continuous:true has known flakiness on Android Chrome:
    // interim results can keep streaming but never get finalized when
    // .stop() is called, so the transcript silently stays empty even
    // though speech was clearly heard. continuous:false lets the
    // recognizer use its own built-in silence-detection to end the
    // utterance and reliably fire a final result before onend.
    _micRecognizer.continuous=false;
    _micRecognizer.interimResults=true;
    _micRecognizer.maxAlternatives=1;
    _micRecognizer.onstart=()=>{ MIC.recogStatus='listening'; render(); };
    _micRecognizer.onspeechstart=()=>{ MIC.recogStatus='speech-detected'; render(); };
    _micRecognizer.onresult=e=>{
      let finalTxt='', interimTxt='';
      for(let i=0;i<e.results.length;i++){
        const txt=e.results[i][0].transcript||'';
        if(e.results[i].isFinal) finalTxt+=txt; else interimTxt+=txt;
      }
      if(finalTxt) MIC.transcript=(MIC.transcript||'')+finalTxt;
      MIC.interim=interimTxt;
      render();
    };
    _micRecognizer.onerror=e=>{
      MIC.recogError=e.error||'unknown';
      MIC.recogStatus='error';
      console.warn('[speech] recognition error:', e.error, e.message||'');
      render();
    };
    _micRecognizer.onend=()=>{
      MIC.recogStatus='ended';
      if(MIC.phase==='listening') _finishRecording(pyEsc);
    };
    try{
      _micRecognizer.start();
    }catch(e){
      MIC.recogError='start-failed: '+(e.message||e.name||'unknown');
      MIC.recogStatus='error';
      console.warn('[speech] start() threw:', e);
    }
    // Hard cap: 8s
    setTimeout(()=>{ if(MIC.phase==='listening'&&_micRecognizer){ try{_micRecognizer.stop();}catch(e){} }}, 8000);
  } else {
    MIC.recogStatus='unsupported';
    console.warn('[speech] SpeechRecognition API not available in this browser/context');
    setTimeout(()=>{ if(MIC.phase==='listening') _finishRecording(pyEsc); }, 5000);
  }
}

function manualStopMic(zhEsc, pyEsc) {
  if(_micRecognizer){ try{_micRecognizer.stop();}catch(e){} }
  else _finishRecording(pyEsc||_pendingPy);
}

function _finishRecording(py) {
  _micRecognizer=null;

  function _complete(){
    if(_micStream){ _micStream.getTracks().forEach(t=>t.stop()); _micStream=null; }
    _mediaRecorder=null;
    MIC.phase='done';
    render();
  }

  if(_mediaRecorder && _mediaRecorder.state!=='inactive'){
    _mediaRecorder.onstop=()=>{
      try{
        const mime=_mediaRecorder.mimeType||'audio/webm';
        const blob=new Blob(_recordedChunks,{type:mime});
        if(blob.size>1000) _playbackURL=URL.createObjectURL(blob);
      }catch(e){}
      _complete();
    };
    _mediaRecorder.stop();
  } else {
    _complete();
  }
}

function retryMic(zhEsc, pyEsc) {
  resetMic();
  startMicSession(zhEsc, pyEsc);
}

function showSelfReport(){
  resetMic();
  MIC.phase='self-report';
  render();
}

function resetMicAndRender(){ resetMic(); render(); }

function resetMic() {
  if(_micRecognizer){ try{_micRecognizer.stop();}catch(e){} _micRecognizer=null; }
  if(_micStream){ _micStream.getTracks().forEach(t=>t.stop()); _micStream=null; }
  if(_mediaRecorder&&_mediaRecorder.state!=='inactive'){try{_mediaRecorder.stop();}catch(e){}}
  _mediaRecorder=null; _recordedChunks=[];
  if(_playbackURL){URL.revokeObjectURL(_playbackURL);_playbackURL=null;}
  const oldAudio=document.getElementById('playback-audio');
  if(oldAudio){oldAudio.pause();oldAudio.remove();}
  MIC={phase:'idle', transcript:'', interim:'', recogStatus:'idle', recogError:'', error:''};
}

function scoreMicResult(correct) {
  S.answered=true; S.lastCorrect=correct; S.scoredTotal++; if(correct) S.correct++;
  resetMic();
  commitState(); render();
}


// ── SCORES ──────────────────────────────────────────────────────────
function getScores() { try { return JSON.parse(localStorage.getItem('hsk2_scores') || '{}'); } catch(e) { return {}; } }
function saveScore(id, pct) { const sc = getScores(); if (!sc[id] || pct > sc[id]) { sc[id] = pct; localStorage.setItem('hsk2_scores', JSON.stringify(sc)); } }
function getHighScore(id) { return getScores()[id] ?? null; }
function getCompletedCount() { return Object.keys(getScores()).length; }

// ── RESUME SAVE/LOAD ─────────────────────────────────────────────────
const RESUME_KEY = 'hsk2_resume';
function saveResume() {
  if (S.screen !== 'lesson') return;
  const data = {
    lessonIdx: S.lessonIdx,
    promptIdx: S.promptIdx,
    maxVisited: S.maxVisited,
    scoredTotal: S.scoredTotal,
    correct: S.correct,
    promptStates: S.promptStates,
  };
  localStorage.setItem(RESUME_KEY, JSON.stringify(data));
}
function loadResume() {
  try { return JSON.parse(localStorage.getItem(RESUME_KEY)); } catch(e) { return null; }
}
function clearResume() { localStorage.removeItem(RESUME_KEY); }
function hasSavedProgress(lessonIdx) {
  const r = loadResume();
  return r && r.lessonIdx === lessonIdx && r.promptIdx > 0;
}

// ── STATE ────────────────────────────────────────────────────────────
// S.promptStates[i] stores the full interactive state for prompt i so
// the user can navigate back and review (or forward to already-seen).
// FIX: selectedOpt is now an INTEGER INDEX into p.opts[], never a string.
// This avoids all HTML-attribute apostrophe escaping issues entirely.
let S = {
  screen: 'home',
  lessonIdx: 0,
  promptIdx: 0,
  maxVisited: 0,        // highest promptIdx visited this session
  scoredTotal: 0,
  correct: 0,
  promptStates: [],     // per-prompt state for back/forward nav
  // live prompt state (mirrored into promptStates on every change):
  answered: false,
  lastCorrect: null,
  selectedOpt: null,    // INTEGER index into p.opts (fill / tr)
  posSelected: null,    // position index (pos prompt)
  multiHeld: null,      // bank tile index currently held
  multiAssigned: {},    // { blankId: wordString }
  multiUsed: [],        // bank indices already placed
  woShuffled: null,
  woSelected: [],
  woAnswer: [],
};

// ── PROMPT STATE SNAPSHOT ────────────────────────────────────────────
function snapshotState() {
  return {
    answered: S.answered, lastCorrect: S.lastCorrect,
    selectedOpt: S.selectedOpt,
    posSelected: S.posSelected,
    multiHeld: S.multiHeld, multiAssigned: JSON.parse(JSON.stringify(S.multiAssigned)),
    multiUsed: [...S.multiUsed],
    woShuffled: S.woShuffled ? [...S.woShuffled] : null,
    woSelected: [...S.woSelected], woAnswer: [...S.woAnswer],
  };
}
function restoreState(snap) {
  if (!snap) return;
  S.answered = snap.answered; S.lastCorrect = snap.lastCorrect;
  S.selectedOpt = snap.selectedOpt;
  S.posSelected = snap.posSelected;
  S.multiHeld = snap.multiHeld; S.multiAssigned = JSON.parse(JSON.stringify(snap.multiAssigned));
  S.multiUsed = [...snap.multiUsed];
  S.woShuffled = snap.woShuffled ? [...snap.woShuffled] : null;
  S.woSelected = [...snap.woSelected]; S.woAnswer = [...snap.woAnswer];
}
function clearLiveState() {
  S.answered = false; S.lastCorrect = null; S.selectedOpt = null;
  S.posSelected = null; S.multiHeld = null; S.multiAssigned = {};
  S.multiUsed = []; S.woShuffled = null; S.woSelected = []; S.woAnswer = [];
}
function commitState() {
  S.promptStates[S.promptIdx] = snapshotState();
  saveResume();
}

// ── UTILITIES ────────────────────────────────────────────────────────
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function zhEl(text) { const e = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); const esc = text.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); return `<span class="zh" onclick="speakChinese('${esc}')">${e}</span>`; }
function countScoredPrompts(prompts) { return prompts.filter(p => p.t !== 'intro').length; }
function getLessonProgress() {
  const L = LESSONS[S.lessonIdx]; let s = 0;
  for (let i = 0; i <= S.promptIdx; i++) if (L.prompts[i] && L.prompts[i].t !== 'intro') s++;
  return { scored: s, total: countScoredPrompts(L.prompts) };
}

// ── RENDER DISPATCH ──────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (S.screen === 'home') app.innerHTML = renderHome();
  else if (S.screen === 'intro') app.innerHTML = renderLessonIntro();
  else if (S.screen === 'lesson') app.innerHTML = renderLesson();
  else if (S.screen === 'complete') app.innerHTML = renderComplete();
}

// ── HOME ─────────────────────────────────────────────────────────────
function renderHome() {
  const done = getCompletedCount();
  const pct = Math.round(done / LESSONS.length * 100);
  const cards = LESSONS.map((L, i) => {
    const hs = getHighScore(L.id); const completed = hs !== null;
    const inProgress = hasSavedProgress(i);
    const locked = i > 0 && getHighScore(LESSONS[i-1].id) === null && !hasSavedProgress(i);
    const cls = completed ? 'completed' : inProgress ? 'in-progress' : locked ? 'locked' : '';
    const tags = L.grammar.map(g => `<span class="tag">${g.zh} ${g.py}</span>`).join('');
    let score = '';
    if (hs !== null) score = `<div><div class="high-score">${hs}%</div><div style="font-size:.7rem;color:var(--ink-faint)">Best</div></div>`;
    else if (inProgress) score = `<div style="font-size:.75rem;color:var(--gold);font-weight:600">In progress</div>`;
    else if (locked) score = `<span style="font-size:1.1rem;color:var(--ink-faint)">🔒</span>`;
    return `<div class="lesson-card ${cls}" onclick="${locked?'':'startLessonIntro('+i+')'}">
      <div class="lesson-num">${L.id}</div>
      <div class="lesson-info"><div class="lesson-title">${L.title}</div><div style="font-size:.8rem;color:var(--ink-soft)">${L.subtitle}</div><div class="lesson-tags">${tags}</div></div>
      ${score}</div>`;
  }).join('');
  return `<div class="home fade-in">
    <div class="home-header"><div class="home-title">普通话</div><div class="home-sub">HSK 2 Grammar Journey · 10 Lessons</div></div>
    <div class="progress-banner">
      <svg class="progress-ring" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="#F0E8E8" stroke-width="6"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="#C0392B" stroke-width="6"
          stroke-dasharray="${2*Math.PI*26}" stroke-dashoffset="${2*Math.PI*26*(1-pct/100)}"
          stroke-linecap="round" transform="rotate(-90 32 32)"/>
        <text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#C0392B" font-family="DM Sans,sans-serif">${pct}%</text>
      </svg>
      <div class="progress-info">
        <div class="progress-label">Overall Progress</div>
        <div style="font-size:1rem;font-weight:600">${done} of ${LESSONS.length} lessons completed</div>
        <div style="font-size:.82rem;color:var(--ink-soft);margin-top:2px">${done>0?'Keep going! 加油！':'Begin your journey below'}</div>
      </div>
    </div>
    <div class="lessons-grid">${cards}</div></div>`;
}

// ── LESSON INTRO ─────────────────────────────────────────────────────
function renderLessonIntro() {
  const L = LESSONS[S.lessonIdx]; const hs = getHighScore(L.id);
  const hasSaved = hasSavedProgress(S.lessonIdx);
  const gpCards = L.grammar.map(g => `<div class="gp-card">
    <div class="gp-card-top"><span class="gp-zh" onclick="speakChinese('${g.zh}')">${g.zh}</span><span class="gp-py">${g.py}</span><span class="gp-meaning">— ${g.meaning}</span></div>
    <div class="gp-pattern"><strong>Pattern</strong>${g.pattern}</div></div>`).join('');
  const resumeBtn = hasSaved ? `<button class="resume-btn" onclick="resumeLesson()">▶ Continue where I left off</button>` : '';
  return `<div class="lesson-intro fade-in">
    <button class="back-btn" onclick="goHome()">← All Lessons</button>
    <div class="intro-header"><div class="intro-lesson-num">Lesson ${L.id}</div><div class="intro-title">${L.title}</div><div class="intro-desc">${L.subtitle} · ${countScoredPrompts(L.prompts)} practice prompts</div></div>
    <div class="grammar-preview">${gpCards}</div>
    ${hs!==null?`<div style="text-align:center;margin-bottom:12px;font-size:.85rem;color:var(--ink-soft)">Your best: <strong style="color:var(--red)">${hs}%</strong></div>`:''}
    ${resumeBtn}
    <button class="start-btn" onclick="startLesson(false)">${hasSaved?'Start Over':'Start Lesson →'}</button></div>`;
}

// ── LESSON VIEW ──────────────────────────────────────────────────────
function renderLesson() {
  const L = LESSONS[S.lessonIdx]; const p = L.prompts[S.promptIdx];
  const { scored, total } = getLessonProgress();
  const pct = total > 0 ? (scored / total * 100) : 0;
  const scorePct = S.scoredTotal > 0 ? Math.round(S.correct / S.scoredTotal * 100) : 0;
  const canBack = S.promptIdx > 0;
  const canForward = S.promptIdx < S.maxVisited;
  let promptHtml = '';
  if (p.t === 'intro') promptHtml = renderIntroCard(p, L);
  else if (p.t === 'speak') promptHtml = renderSpeak(p);
  else if (p.t === 'fill') promptHtml = renderFill(p);
  else if (p.t === 'pos') promptHtml = renderPos(p);
  else if (p.t === 'multi') promptHtml = renderMulti(p);
  else if (p.t === 'wo') promptHtml = renderWordOrder(p);
  else if (p.t === 'tr') promptHtml = renderTranslate(p);
  return `<div class="lesson-view fade-in">
    <div class="lesson-topbar">
      <button class="quit-btn" title="Quit" onclick="confirmQuit()">✕</button>
      <div class="lesson-progress-wrap"><div class="lesson-progress" style="width:${pct}%"></div></div>
      <div class="score-display">${S.scoredTotal>0?scorePct+'%':'—'}</div>
      <div class="nav-btns">
        <button class="nav-btn" onclick="navBack()" ${canBack?'':' disabled'} title="Previous">◀</button>
        <button class="nav-btn" onclick="navForward()" ${canForward?'':' disabled'} title="Next">▶</button>
      </div>
    </div>
    <div class="prompt-area">${promptHtml}</div></div>`;
}

// ── INTRO CARD ───────────────────────────────────────────────────────
function renderIntroCard(p, L) {
  const g = L.grammar[p.g];
  const exHtml = g.examples.map(ex => {
    const esc = ex.zh.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="intro-example">
      <div class="ex-zh" onclick="speakChinese('${esc}')">${ex.zh}</div>
      <div class="ex-py">${ex.py}</div><div class="ex-en">${ex.en}</div></div>`;
  }).join('');
  const zhEsc = g.zh.replace(/'/g,"\\'");
  return `<div class="prompt-card pop-in"><div class="prompt-type-label">📖 New Grammar Point</div>
    <div class="intro-card-inner">
      <div class="intro-point-zh" onclick="speakChinese('${zhEsc}')">${g.zh}</div>
      <div class="intro-point-py">${g.py}</div>
      <div class="intro-point-meaning">${g.meaning}</div>
      <div class="intro-pattern-box"><strong>Pattern</strong>${g.pattern}</div>
      <div class="intro-explanation">${g.explanation}</div>
      <div class="intro-examples">${exHtml}</div>
      <button class="continue-btn" onclick="nextPrompt()">Got it — let's practice! →</button>
    </div></div>`;
}

// ── SPEAK ────────────────────────────────────────────────────────────
// renderSpeak defined above in mic JS block

// ── FILL-IN-BLANK ─────────────────────────────────────────────────────
// FIX: options are rendered with data-idx; clicks call selectOpt(idx)
function renderFill(p) {
  const parts = p.sent.split('___');
  const filled = S.answered
    ? `<span class="blank-box" style="${S.lastCorrect?'color:var(--green);border-color:var(--green)':'color:var(--wrong);border-color:var(--wrong)'}"> ${p.ans} </span>`
    : `<span class="blank-box">　　　</span>`;
  const sentHtml = parts.map((pt, i) => `${zhEl(pt)}${i < parts.length-1 ? filled : ''}`).join('');
  const opts = p.opts.map((o, i) => {
    let cls = '';
    if (S.answered) { if (o === p.ans) cls = 'correct'; else if (i === S.selectedOpt && !S.lastCorrect) cls = 'wrong'; }
    else if (i === S.selectedOpt) cls = 'selected';
    return `<button class="option-btn ${cls}" onclick="${S.answered?'':'selectOpt('+i+')'}" ${S.answered?'disabled':''}>${zhEl(o)}</button>`;
  }).join('');
  const btn = !S.answered
    ? `<button class="check-btn" onclick="checkFill()" ${S.selectedOpt!==null?'':'disabled'}>Check</button>`
    : `<button class="next-btn" onclick="nextPrompt()">Next →</button>`;
  return `<div class="prompt-card pop-in"><div class="prompt-type-label">✏️ Fill in the Blank</div>
    <div class="sentence-display">${sentHtml}</div>
    <div class="sentence-py">${p.py}</div><div class="sentence-en">${p.en}</div>
    <div class="options-grid">${opts}</div>${btn}
    ${S.answered ? renderFeedback(S.lastCorrect, 'Correct: '+p.ans, p.zh) : ''}
  </div>`;
}

// ── POSITION PROMPT ───────────────────────────────────────────────────
function renderPos(p) {
  const numMarkers = p.segs.length + 1;
  let sentParts = '';
  for (let i = 0; i < numMarkers; i++) {
    let cls = 'pos-marker';
    if (S.answered) {
      if (i === p.ans) cls += ' correct-pos';
      else if (i === S.posSelected && i !== p.ans) cls += ' wrong-pos';
    } else if (i === S.posSelected) cls += ' selected';
    sentParts += `<span class="${cls}" onclick="${S.answered?'':'selectPos('+i+')'}">${i+1}</span>`;
    if (i < p.segs.length) sentParts += `<span class="pos-seg">${p.segs[i]}</span>`;
  }
  let previewHtml = '';
  const previewPos = S.answered ? p.ans : S.posSelected;
  if (previewPos !== null) {
    const preview = buildPosSentence(p, previewPos);
    const col = S.answered ? (S.lastCorrect?'var(--green)':'var(--wrong)') : 'var(--ink-soft)';
    previewHtml = `<div class="pos-preview"><div class="pos-preview-text" style="color:${col}">${preview}</div></div>`;
  }
  const wordEsc = p.word.replace(/'/g,"\\'");
  const btn = !S.answered
    ? `<button class="check-btn" onclick="checkPos()" ${S.posSelected!==null?'':'disabled'}>Check</button>`
    : `<button class="next-btn" onclick="nextPrompt()">Next →</button>`;
  return `<div class="prompt-card pop-in"><div class="prompt-type-label">📍 Place the Word</div>
    <div class="pos-word-display"><div class="pos-word-chip" onclick="speakChinese('${wordEsc}')">${p.word}<span class="chip-py">${p.wordPy}</span></div></div>
    ${!S.answered?`<div class="pos-instruction">Tap the numbered slot where <strong>${p.word}</strong> belongs</div>`:''}
    <div class="pos-sentence-wrap">${sentParts}</div>
    ${previewHtml}
    <div style="text-align:center;font-size:.82rem;color:var(--ink-faint);margin-bottom:14px">${p.en}</div>
    ${btn}${S.answered ? renderFeedback(S.lastCorrect,'','') : ''}
  </div>`;
}
function buildPosSentence(p, pos) {
  let parts = [];
  for (let i = 0; i <= p.segs.length; i++) {
    if (i === pos) parts.push(`<span class="pos-preview-word">${p.word}</span>`);
    if (i < p.segs.length) parts.push(`<span style="font-family:'Noto Sans SC',sans-serif;font-size:1.05rem">${p.segs[i]}</span>`);
  }
  return parts.join('');
}

// ── MULTI-BLANK ───────────────────────────────────────────────────────
function renderMulti(p) {
  const sentHtml = p.parts.map(part => {
    if (typeof part === 'string') return `<span class="multi-seg">${zhEl(part)}</span>`;
    const id = part.id; const assigned = S.multiAssigned[id];
    let cls = 'multi-blank';
    if (S.answered) {
      cls += (assigned === p.answers[id]) ? ' correct-blank' : ' wrong-blank';
    } else if (assigned && assigned !== '—') cls += ' filled';
    else if (assigned === '—') cls += ' filled-dash';
    const inner = assigned
      ? `<span class="blank-label">${id}</span><span class="blank-word">${assigned}</span>`
      : `<span class="blank-label">${id}</span>`;
    return `<span class="${cls}" onclick="${S.answered?'':'clickBlank(\''+id+'\')'}">${inner}</span>`;
  }).join('');

  const bankHtml = p.bank.map((w, i) => {
    const isDash = w === '—';
    let cls = `bank-tile ${isDash?'dash-tile':''}`;
    if (S.answered || S.multiUsed.includes(i)) cls += ' used';
    else if (S.multiHeld === i) cls += ' held';
    return `<div class="${cls}" onclick="${S.answered||S.multiUsed.includes(i)?'':'holdBankTile('+i+')'}"><span class="tile-zh">${w}</span></div>`;
  }).join('');

  const allFilled = p.parts.filter(pt => typeof pt === 'object').every(pt => S.multiAssigned[pt.id] !== undefined);
  const btn = !S.answered
    ? `<button class="check-btn" onclick="checkMulti()" ${allFilled?'':'disabled'}>Check</button>`
    : `<button class="next-btn" onclick="nextPrompt()">Next →</button>`;

  let correctNote = '';
  if (S.answered && !S.lastCorrect) {
    const lines = Object.entries(p.answers).map(([k,v]) => `${k}→${v}`).join('  ');
    correctNote = `<div style="font-size:.8rem;color:var(--wrong);margin-top:6px">Correct: ${lines}</div>`;
  }

  return `<div class="prompt-card pop-in"><div class="prompt-type-label">🔤 Fill Multiple Blanks</div>
    <div class="multi-en">${p.en}</div>
    <div class="multi-sentence">${sentHtml}</div>
    ${!S.answered?'<div style="font-size:.78rem;color:var(--ink-faint);text-align:center;margin-bottom:6px">Tap a word to hold it (red), then tap a blank slot — use "—" for empty slots</div>':''}
    <div class="multi-bank-label">Word Bank</div>
    <div class="multi-bank">${bankHtml}</div>
    ${btn}${correctNote}${S.answered ? renderFeedback(S.lastCorrect,'','') : ''}
  </div>`;
}

// ── WORD ORDER ────────────────────────────────────────────────────────
function renderWordOrder(p) {
  if (!S.woShuffled) S.woShuffled = shuffle(p.words.map((w,i) => ({...w, origIdx:i})));
  const answerTiles = S.woAnswer.map((item, i) => {
    const cls = S.answered ? (S.lastCorrect ? 'correct-tile' : 'wrong-tile') : '';
    const wEsc = item.w.replace(/'/g,"\\'");
    return `<span class="answer-tile ${cls}" onclick="${S.answered?'':'removeFromAnswer('+i+')'}">${zhEl(item.w)}<span style="font-size:.62rem;color:var(--ink-soft)">${item.p}</span></span>`;
  }).join('');
  const availTiles = S.woShuffled.map((item, i) => {
    const used = S.woSelected.includes(i);
    return `<span class="word-tile ${used?'used':''}" onclick="${used||S.answered?'':'addToAnswer('+i+')'}">${zhEl(item.w)}<span class="tile-py">${item.p}</span></span>`;
  }).join('');
  const correct = p.words.map(w => w.w).join('');
  const correctEsc = correct.replace(/'/g,"\\'");
  const btn = !S.answered
    ? `<button class="check-btn" onclick="checkWordOrder()" ${S.woAnswer.length===p.words.length?'':'disabled'}>Check</button>`
    : `<button class="next-btn" onclick="nextPrompt()">Next →</button>`;
  return `<div class="prompt-card pop-in"><div class="prompt-type-label">🧩 Arrange the Words</div>
    <div style="font-size:.88rem;color:var(--ink-soft);margin-bottom:12px">Translate: <em>${p.en}</em></div>
    <div class="wordorder-answer-area ${S.woAnswer.length?'has-words':''}">
      ${S.woAnswer.length?answerTiles:'<span class="answer-placeholder">Tap words below to build the sentence</span>'}
    </div>
    <div class="wordorder-tiles">${availTiles}</div>
    ${btn}${S.answered ? renderFeedback(S.lastCorrect, 'Correct: '+correct, correct) : ''}
  </div>`;
}

// ── TRANSLATE ─────────────────────────────────────────────────────────
// FIX: options use index; text displayed as innerHTML (safe), never in onclick
function renderTranslate(p) {
  const zhEsc = p.zh.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const opts = p.opts.map((o, i) => {
    let cls = '';
    if (S.answered) { if (o === p.ans) cls = 'correct'; else if (i === S.selectedOpt && !S.lastCorrect) cls = 'wrong'; }
    else if (i === S.selectedOpt) cls = 'selected';
    // o is displayed as text content — safe because it's English, no JS injection needed
    const safeO = o.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<button class="option-btn ${cls}" style="font-size:.88rem;text-align:left;justify-content:flex-start;padding:12px 14px;" onclick="${S.answered?'':'selectOpt('+i+')'}" ${S.answered?'disabled':''}>${safeO}</button>`;
  }).join('');
  const btn = !S.answered
    ? `<button class="check-btn" onclick="checkTranslate()" ${S.selectedOpt!==null?'':'disabled'}>Check</button>`
    : `<button class="next-btn" onclick="nextPrompt()">Next →</button>`;
  return `<div class="prompt-card pop-in"><div class="prompt-type-label">🌐 Translate to English</div>
    <div class="translate-center">
      <div class="translate-zh" onclick="speakChinese('${zhEsc}')">${p.zh}</div>
      <div class="translate-py">${p.py}</div>
      <button class="audio-btn" onclick="speakChinese('${zhEsc}')">🔊 Hear it</button>
    </div>
    <div style="margin-top:18px"><div class="options-grid" style="grid-template-columns:1fr;">${opts}</div></div>
    ${btn}${S.answered ? renderFeedback(S.lastCorrect, 'Answer: '+p.ans, '') : ''}
  </div>`;
}

// ── FEEDBACK ─────────────────────────────────────────────────────────
function renderFeedback(correct, detail, zhText) {
  const icon = correct ? '✅' : '❌'; const msg = correct ? 'Correct! 太棒了！' : 'Not quite.';
  const zhEsc = zhText ? zhText.replace(/\\/g,'\\\\').replace(/'/g,"\\'") : '';
  const dtl = detail
    ? `<div class="feedback-detail">${detail}${zhText?` <span class="zh" style="font-size:.9rem" onclick="speakChinese('${zhEsc}')">🔊</span>`:''}</div>` : '';
  return `<div class="feedback-bar ${correct?'correct':'wrong'}"><span class="feedback-icon">${icon}</span><div><div>${msg}</div>${dtl}</div></div>`;
}

// ── COMPLETE ──────────────────────────────────────────────────────────
function renderComplete() {
  const L = LESSONS[S.lessonIdx];
  const pct = S.scoredTotal>0 ? Math.round(S.correct/S.scoredTotal*100) : 0;
  const hs = getHighScore(L.id); const isNew = hs === pct;
  const trophy = pct>=90?'🏆':pct>=70?'🥈':'📚';
  const grade = pct>=90?'Excellent!':pct>=70?'Good job!':'Keep practicing!';
  const nextIdx = S.lessonIdx+1; const hasNext = nextIdx < LESSONS.length;
  return `<div class="complete fade-in"><div class="complete-card">
    <div class="complete-trophy">${trophy}</div>
    <div class="complete-title">${grade}</div>
    <div class="complete-sub">Lesson ${L.id}: ${L.title}</div>
    <div class="score-big">${pct}<span style="font-size:2rem">%</span></div>
    <div class="score-label">${S.correct} correct out of ${S.scoredTotal} prompts</div>
    ${isNew?'<div class="high-score-badge">⭐ New High Score!</div>':`<div style="font-size:.8rem;color:var(--ink-faint);margin-top:4px">Best: ${hs}%</div>`}
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" style="color:var(--green)">${S.correct}</div><div class="stat-label">Correct</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--red)">${S.scoredTotal-S.correct}</div><div class="stat-label">Incorrect</div></div>
      <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-label">Score</div></div>
    </div>
  </div>
  <div class="complete-actions">
    ${hasNext&&pct>=50?`<button class="action-btn primary" onclick="startLessonIntro(${nextIdx})">Next Lesson: ${LESSONS[nextIdx].title} →</button>`:''}
    <button class="action-btn secondary" onclick="startLessonIntro(${S.lessonIdx})">Retry This Lesson</button>
    <button class="action-btn secondary" onclick="goHome()">← All Lessons</button>
  </div></div>`;
}

// ── NAVIGATION ────────────────────────────────────────────────────────
function goHome() { S.screen='home'; render(); }
function startLessonIntro(idx) { S.screen='intro'; S.lessonIdx=idx; render(); }

function startLesson(isResume) {
  resetMic();
  const r = isResume ? loadResume() : null;
  if (r && r.lessonIdx === S.lessonIdx) {
    S.promptIdx = r.promptIdx;
    S.maxVisited = r.maxVisited;
    S.scoredTotal = r.scoredTotal;
    S.correct = r.correct;
    S.promptStates = r.promptStates || [];
    restoreState(S.promptStates[S.promptIdx] || null);
  } else {
    clearResume();
    S.promptIdx=0; S.maxVisited=0; S.scoredTotal=0; S.correct=0;
    S.promptStates=[]; clearLiveState();
  }
  S.screen='lesson'; render();
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  if (p.t==='speak'||p.t==='tr') speakChinese(p.zh);
  else if (p.t==='intro') speakChinese(LESSONS[S.lessonIdx].grammar[p.g].zh);
  else if (p.t==='pos') speakChinese(p.word);
}

function resumeLesson() { startLesson(true); }

function nextPrompt() {
  commitState();
  const L = LESSONS[S.lessonIdx];
  if (S.promptIdx + 1 >= L.prompts.length) {
    // Lesson finished
    const pct = S.scoredTotal>0 ? Math.round(S.correct/S.scoredTotal*100) : 0;
    saveScore(L.id, pct);
    clearResume();
    S.screen='complete'; render(); return;
  }
  S.promptIdx++;
  S.maxVisited = Math.max(S.maxVisited, S.promptIdx);
  if (S.promptStates[S.promptIdx]) {
    restoreState(S.promptStates[S.promptIdx]);
  } else {
    clearLiveState();
  }
  render();
  const p = L.prompts[S.promptIdx];
  if (!S.answered) {
    if (p.t==='speak'||p.t==='tr') speakChinese(p.zh);
    else if (p.t==='intro') speakChinese(L.grammar[p.g].zh);
    else if (p.t==='pos') speakChinese(p.word);
  }
}

function navBack() {
  if (S.promptIdx <= 0) return;
  resetMic();
  commitState();
  S.promptIdx--;
  restoreState(S.promptStates[S.promptIdx] || null);
  if (!S.promptStates[S.promptIdx]) clearLiveState();
  render();
}

function navForward() {
  if (S.promptIdx >= S.maxVisited) return;
  resetMic();
  commitState();
  S.promptIdx++;
  if (S.promptStates[S.promptIdx]) restoreState(S.promptStates[S.promptIdx]);
  else clearLiveState();
  render();
}

function confirmQuit() {
  if (confirm('Quit this lesson? Progress is saved — you can resume later.')) {
    resetMic();
    commitState();
    goHome();
  }
}

// ── ANSWER HANDLERS ───────────────────────────────────────────────────
function answerSpeak(correct) { scoreMicResult(correct); } // legacy alias
// FIX: selectOpt takes an integer index
function selectOpt(idx) {
  if (S.answered) return;
  S.selectedOpt = idx;
  commitState(); render();
}
function checkFill() {
  if (S.selectedOpt === null) return;
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  S.answered=true; S.lastCorrect=(p.opts[S.selectedOpt]===p.ans);
  S.scoredTotal++; if(S.lastCorrect) S.correct++;
  commitState(); render();
}
function checkTranslate() {
  if (S.selectedOpt === null) return;
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  S.answered=true; S.lastCorrect=(p.opts[S.selectedOpt]===p.ans);
  S.scoredTotal++; if(S.lastCorrect) S.correct++;
  commitState(); render();
}
function selectPos(idx) { if(S.answered) return; S.posSelected=idx; commitState(); render(); }
function checkPos() {
  if (S.posSelected===null) return;
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  S.answered=true; S.lastCorrect=(S.posSelected===p.ans); S.scoredTotal++; if(S.lastCorrect) S.correct++;
  if (S.lastCorrect) speakChinese(buildPosSentenceText(p, p.ans));
  commitState(); render();
}
function buildPosSentenceText(p, pos) {
  let parts=[];
  for(let i=0;i<=p.segs.length;i++){if(i===pos)parts.push(p.word);if(i<p.segs.length)parts.push(p.segs[i]);}
  return parts.join('');
}
function holdBankTile(idx) { if(S.answered) return; S.multiHeld=(S.multiHeld===idx?null:idx); commitState(); render(); }
function clickBlank(id) {
  if(S.answered) return;
  if (S.multiHeld === null) {
    if (S.multiAssigned[id] !== undefined) {
      const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
      const word = S.multiAssigned[id];
      const bi = S.multiUsed.find(i => p.bank[i]===word && S.multiUsed.includes(i));
      // find correct bank index
      for(let k=0;k<p.bank.length;k++){if(p.bank[k]===word&&S.multiUsed.includes(k)){S.multiUsed.splice(S.multiUsed.indexOf(k),1);break;}}
      delete S.multiAssigned[id];
      commitState(); render();
    }
    return;
  }
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  if (S.multiAssigned[id] !== undefined) {
    const old=S.multiAssigned[id];
    for(let k=0;k<p.bank.length;k++){if(p.bank[k]===old&&S.multiUsed.includes(k)){S.multiUsed.splice(S.multiUsed.indexOf(k),1);break;}}
  }
  S.multiAssigned[id] = p.bank[S.multiHeld];
  S.multiUsed.push(S.multiHeld); S.multiHeld=null;
  commitState(); render();
}
function checkMulti() {
  const p = LESSONS[S.lessonIdx].prompts[S.promptIdx];
  const blanks = p.parts.filter(pt=>typeof pt==='object').map(pt=>pt.id);
  let ok=true;
  for(const id of blanks){if(S.multiAssigned[id]!==p.answers[id]){ok=false;break;}}
  S.answered=true; S.lastCorrect=ok; S.scoredTotal++; if(ok) S.correct++;
  commitState(); render();
}
function addToAnswer(si) {
  if(S.answered||S.woSelected.includes(si)) return;
  S.woSelected.push(si); S.woAnswer.push({...S.woShuffled[si]});
  commitState(); render();
}
function removeFromAnswer(ai) {
  if(S.answered) return;
  const item=S.woAnswer[ai];
  for(let k=0;k<S.woShuffled.length;k++){
    if(S.woShuffled[k].origIdx===item.origIdx&&S.woSelected.includes(k)){S.woSelected.splice(S.woSelected.indexOf(k),1);break;}
  }
  S.woAnswer.splice(ai,1); commitState(); render();
}
function checkWordOrder() {
  const p=LESSONS[S.lessonIdx].prompts[S.promptIdx];
  const user=S.woAnswer.map(w=>w.w).join(''); const correct=p.words.map(w=>w.w).join('');
  S.answered=true; S.lastCorrect=(user===correct); S.scoredTotal++; if(S.lastCorrect) S.correct++;
  if(S.lastCorrect) speakChinese(correct);
  commitState(); render();
}

// ── INIT ──────────────────────────────────────────────────────────────
// Defensive wrapper: if anything throws during initial render, show a
// visible, readable error instead of a blank white screen. This turns
// any future "the app just doesn't load" report into something we can
// actually diagnose from the error text shown on screen.
try {
  render();
} catch(e) {
  console.error('[fatal] Initial render failed:', e);
  const app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="max-width:480px;margin:60px auto;padding:24px;font-family:sans-serif;color:#7F1D1D;background:#FEF2F2;border-radius:12px;line-height:1.6;">'
      + '<h2 style="margin-bottom:12px;">Something went wrong loading the app</h2>'
      + '<p style="font-size:.9rem;margin-bottom:12px;">' + (e && e.message ? e.message : String(e)) + '</p>'
      + '<p style="font-size:.85rem;color:#92400E;">Try clearing this site&#39;s cached data and reloading — in Chrome: tap the lock icon in the address bar &rarr; Site settings &rarr; Clear &amp; reset, then reload.</p>'
      + '</div>';
  }
}
